project:
 type: website
 output-dir: docs

website:
 title: "Eric Eliot Schnitger's Portfolio"
 favicon: assets/favicon.svg
 navbar:
   left:
     - text: "Home"
       href: index.qmd
     - text: "Projects"
       href: projects/index.qmd
     - text: "Writings"
       href: writing/index.qmd
     - text: "About"
       href: about.qmd
   right:
     - icon: github
       href: https://github.com/eschnitger

format:
 html:
   theme: [cosmo, theme.scss]   # theme.scss holds the site colours and fonts
   css: styles.css
   include-in-header:
     text: |
       <link rel="preconnect" href="https://api.fontshare.com">
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,600&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
       <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
   toc: true
   toc-location: left

execute:
  freeze: auto  # Or use 'true'
  echo: false      # Hides the code input blocks globally
  warning: false   # Optional: hides Python runtime warnings
  message: false   # Optional: hides Python package messages